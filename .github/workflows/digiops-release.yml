name: KrushiWorld DigiOps Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: krushiworld-digiops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Validate APMC application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, sqlite3, pdo_sqlite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax checks
        run: find apmc-rates tools -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Staging-to-production identity and MFA regression tests
        run: php apmc-rates/tests/test_auth_handover.php
      - name: PHP pretty URL and layered service contracts
        run: php apmc-rates/tests/test_pretty_routes.php
      - name: SQLite price intelligence and comparability contracts
        run: php apmc-rates/tests/test_intelligence.php
      - name: Phase 4 official MSP, profiles and explainable insight contracts
        run: php apmc-rates/tests/test_phase4.php
      - name: Python unit tests
        run: python -m unittest discover -s apmc-rates/tests -p 'test_*.py' -v
      - name: JavaScript syntax checks
        run: |
          for file in apmc-rates/public/build/*.js; do node --check "$file"; done
          node --check tools/visual-audit.cjs
      - name: Test crop emoji resolver
        run: node --test apmc-rates/tests/commodity-icons.test.cjs
      - name: Market label regression in all three languages
        run: |
          node --test apmc-rates/tests/market-name.test.cjs
          php apmc-rates/tests/test_market_names.php
      - name: Check no tracked production snapshots
        run: |
          if git ls-files apmc-rates/storage | grep -Ev '(\.gitkeep|\.htaccess)$'; then
            echo 'Do not commit mutable market data to source control' >&2
            exit 1
          fi

  package:
    name: Build and upload digiops-release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Package for DigiOps public/private targets
        run: php tools/package-digiops-release.php
      - name: Verify public/private release payload
        run: php tools/check-digiops-release.php
      - name: HTTP smoke test split Cloudways installation
        run: bash tools/smoke-digiops-release.sh
      - name: Staging and production authentication mode HTTP smoke
        run: bash tools/smoke-auth-handover.sh
      - name: Upload deployable DigiOps artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  visual-audit:
    name: Desktop and mobile browser visual audit
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, sqlite3
      - uses: actions/download-artifact@v4
        with:
          name: digiops-release
          path: release/
      - name: Prepare headless Chromium assertions
        run: |
          npm install --prefix /tmp/krushipulse-visual --no-audit --no-fund --no-save playwright-core@1.56.1
          node --check tools/visual-audit.cjs
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Screenshot and UI interaction checks at four viewport sizes
        env:
          NODE_PATH: /tmp/krushipulse-visual/node_modules
          VISUAL_AUDIT_OUTPUT: visual-audit-screenshots
        run: node tools/visual-audit.cjs
      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krushipulse-visual-audit
          path: visual-audit-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  artifact-verification:
    name: Verify uploaded DigiOps artifact
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/download-artifact@v4
        with:
          name: digiops-release
          path: release/
      - name: Independently verify downloaded package
        run: php tools/check-digiops-release.php